# Default values for Aether Zero-Trust Control Plane
# Target: Gateway service primarily (EP-06)

replicaCount: 3

image:
  repository: aether/gateway
  # Pin by digest in production. The release pipeline should `helm upgrade`
  # with `--set image.digest=sha256:<...>`. The default empty digest is
  # rejected at template-render time (see templates/deployment.yaml) so
  # deployments can never silently fall back to a moving tag.
  digest: ""
  pullPolicy: Always
  # Tag is only used as a human-readable label and for non-prod charts
  # that have not yet been pinned. Production must set `digest`.
  tag: "latest"
# If true, the template refuses to render when `image.digest` is empty.
# Production deployments MUST set this to true and provide a pinned digest:
#   helm upgrade --install aether ./deploy/helm/aether \
#     --set image.digest=sha256:$(crane digest aether/gateway:1.2.3) \
#     --set requireImageDigest=true
# Local dev / CI may set this to false to deploy by tag.
requireImageDigest: false

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 18790
  wsPort: 18790

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
  hosts:
    - host: aether.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Gateway configuration (environment variables)
gateway:
  # Auth: by default the Gateway requires a bearer token. The token can be
  # supplied in two ways (in order of preference):
  #   1. `auth.existingSecret` - reference to a pre-created K8s Secret
  #      containing the `LOCAL_API_TOKEN` key. RECOMMENDED for production.
  #   2. `auth.token` - inline token. Leave empty to have Helm auto-generate
  #      one at install time and print it once. The auto-generated token is
  #      also stored in a Secret so it survives `helm upgrade`.
  auth:
    enabled: true                # set false ONLY for local/dev sandboxes
    existingSecret: ""          # if set, `token` is ignored
    existingSecretKey: LOCAL_API_TOKEN
    token: ""                   # inline token; auto-generated when empty
  env:
    # Server
    GATEWAY_PORT: "18790"
    # LOCAL_API_TOKEN and LOCAL_TOKEN_AUTH_REQUIRED are populated from
    # `gateway.auth.*` below; do NOT set them here directly.
    READONLY_MODE: "true"

    # Memory
    MEMORY_DIR: "./memory-store"
    MEMORY_WINDOW: "50"

    # LLM Provider (Ollama)
    LLM_BASE_URL: ""
    LLM_MODEL: ""
    LLM_API_KEY: ""

    # Data isolation (EP-06 requirement)
    LOCAL_DATA_ONLY: "false"

    # CORS: comma-separated list of origins allowed to call the gateway
    # cross-origin. Leave empty (default) to disallow cross-origin access.
    CORS_ALLOWED_ORIGINS: ""

    # Audit read role: required for /api/status/audit endpoints. Generate
    # with `openssl rand -hex 32`. Leave empty to disable audit access
    # entirely (recommended when no external auditor is configured).
    AUDIT_READ_TOKEN: ""

# Resource limits for gateway
resources:
  limits:
    cpu: "2000m"
    memory: "2Gi"
  requests:
    cpu: "500m"
    memory: "512Mi"

# Node selector, tolerations, affinity
nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: aether-gateway
          topologyKey: kubernetes.io/hostname

# Persistence for memory store (if using hostPath - suitable for single-node dev)
persistence:
  enabled: false
  storageClass: ""
  size: "1Gi"
  hostPath: "/var/lib/aether/memory-store"

# Security context
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Liveness and readiness probes
livenessProbe:
  httpGet:
    path: /health
    port: 18790
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 18790
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# Service monitor for Prometheus (optional)
serviceMonitor:
  enabled: false