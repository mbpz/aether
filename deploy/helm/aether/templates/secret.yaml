{{- /*
Secret template for sensitive Gateway values
EP-06: Tokens and API keys as K8s Secrets
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aether.fullname" . }}-secret
  labels:
    app.kubernetes.io/name: {{ include "aether.name" . }}-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: aether
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  LOCAL_API_TOKEN: {{ .Values.gateway.env.LOCAL_API_TOKEN | quote }}
  LLM_API_KEY: {{ .Values.gateway.env.LLM_API_KEY | quote }}