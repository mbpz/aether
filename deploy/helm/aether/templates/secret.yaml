{{- /*
Secret template for sensitive Gateway values.

Resolution order for `LOCAL_API_TOKEN`:
  1. If `.Values.gateway.auth.existingSecret` is set, the deployment reads
     the token from that Secret and we DO NOT create one here.
  2. Else if `.Values.gateway.auth.token` is non-empty, use it as-is.
  3. Else generate a 32-byte URL-safe random token at install time. The
     value is stored in the Secret and is stable across `helm upgrade`
     (because Helm keeps the same Secret). It is also surfaced through
     NOTES.txt so the operator can record it.

`LOCAL_TOKEN_AUTH_REQUIRED` defaults to true and can be disabled by
setting `.Values.gateway.auth.enabled=false` (only for trusted local dev).
*/ -}}
{{- if and .Values.gateway.auth.enabled (not .Values.gateway.auth.existingSecret) -}}
{{- $token := .Values.gateway.auth.token | default (randAlphaNum 32) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aether.fullname" . }}-secret
  labels:
    app.kubernetes.io/name: {{ include "aether.name" . }}-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: aether
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  LOCAL_API_TOKEN: {{ $token | quote }}
  LLM_API_KEY: {{ .Values.gateway.env.LLM_API_KEY | default "" | quote }}
{{- if not .Values.gateway.auth.token -}}
{{- /* Stash the auto-generated token so NOTES.txt can display it. */ -}}
{{- $_ := set $ "autoToken" $token -}}
{{- end -}}
{{- end -}}
