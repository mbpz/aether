{{- /*
Gateway Deployment template
EP-06: K8s deployment for Aether Gateway
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aether.fullname" . }}-gateway
  labels:
    app.kubernetes.io/name: {{ include "aether.name" . }}-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: aether
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "aether.name" . }}-gateway
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "aether.name" . }}-gateway
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: aether
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: gateway
          {{- if .Values.image.digest }}
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          {{- else }}
          {{- if .Values.requireImageDigest }}
          {{- fail "image.digest must be set in production. Set image.digest=sha256:<...> (or disable requireImageDigest for local dev)." }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          {{- end }}
          imagePullPolicy: {{- if .Values.image.digest }} Always{{- else }} {{ .Values.image.pullPolicy }}{{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.gateway.env.GATEWAY_PORT | int }}
              protocol: TCP
            - name: ws
              containerPort: {{ .Values.gateway.env.GATEWAY_PORT | int }}
              protocol: TCP
          env:
            - name: GATEWAY_PORT
              value: {{ .Values.gateway.env.GATEWAY_PORT | quote }}
            - name: LOCAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  {{- if .Values.gateway.auth.existingSecret }}
                  name: {{ .Values.gateway.auth.existingSecret | quote }}
                  key: {{ .Values.gateway.auth.existingSecretKey | default "LOCAL_API_TOKEN" | quote }}
                  {{- else }}
                  name: {{ include "aether.fullname" . }}-secret
                  key: LOCAL_API_TOKEN
                  {{- end }}
                  optional: false
            - name: LOCAL_TOKEN_AUTH_REQUIRED
              value: {{ .Values.gateway.auth.enabled | default true | quote }}
            - name: READONLY_MODE
              value: {{ .Values.gateway.env.READONLY_MODE | quote }}
            - name: MEMORY_DIR
              value: {{ .Values.gateway.env.MEMORY_DIR | quote }}
            - name: MEMORY_WINDOW
              value: {{ .Values.gateway.env.MEMORY_WINDOW | quote }}
            - name: LLM_BASE_URL
              value: {{ .Values.gateway.env.LLM_BASE_URL | quote }}
            - name: LLM_MODEL
              value: {{ .Values.gateway.env.LLM_MODEL | quote }}
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "aether.fullname" . }}-secret
                  key: LLM_API_KEY
                  optional: true
            - name: LOCAL_DATA_ONLY
              value: {{ .Values.gateway.env.LOCAL_DATA_ONLY | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: memory-store
              mountPath: /var/lib/aether/memory-store
            {{- end }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: memory-store
          persistentVolumeClaim:
            claimName: {{ include "aether.fullname" . }}-pvc
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}