name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly probe for upstream @bytecodealliance/wasmtime per ADR-002.
    - cron: '17 9 * * 1'

# Don't pile up redundant CI runs for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # B7-1: matrix over OS × Node version. macOS runs are about 2× the
  # cost of ubuntu and not required for every PR — only push to main
  # and schedule. PRs from forks run on ubuntu only (saves CI minutes
  # and avoids exposing forks to more runners).
  build-test:
    name: build + test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
        # PRs from forks: ubuntu only.
        include:
          - os: ubuntu-latest
            node: 20
            fork: true
          - os: macos-latest
            node: 20
            fork: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node${{ matrix.node }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node${{ matrix.node }}-npm-

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Probe wasmtime upstream (ADR-002)
        # Informational only — exit 2 ("not yet") is the expected
        # state until @bytecodealliance/wasmtime ships on npm.
        run: npm run check:wasmtime || true

      - name: Probe eBPF agent (ADR-006)
        # Same: exit 2 is expected for sandbox processes that
        # haven't deployed the eBPF agent locally.
        run: npm run check:ebpf || true

      # macOS runner skips upload — dist artifacts aren't useful
      # from macos (they're always rebuilt on linux deploy).
      - name: Upload build artifacts
        if: success() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}-node${{ matrix.node }}-${{ github.sha }}
          path: packages/*/dist/
          retention-days: 7

  # B7-2: Linux-only e2e runner using kind (Kubernetes in Docker).
  # Runs only on main pushes and schedule — not on every PR —
  # because kind takes ~3 min to spin up.
  # NOTE: this is a documentation placeholder. To enable, add
  #   - uses: engineerd/setup-kind@v0.5.0
  #   - run: kind create cluster --wait 60s
  # and a `tests/e2e/k8s-*.sh` smoke suite that deploys the
  # DaemonSet and runs `kubectl exec` to verify enforcement. The
  # eBPF kernel layer requires a KVM-enabled runner; ubuntu-latest
  # in GH Actions does not expose /dev/kvm. Without KVM the XDP
  # attach will fail and the e2e will run in mock mode. See
  # B7-2 in the maturity plan for the unblock plan (custom
  # self-hosted runner with KVM).
  e2e-k8s:
    name: e2e (kind, K8s)
    runs-on: ubuntu-latest
    # Only run on main, not on PRs or forks — keeps PR turnaround fast.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Smoke: kind unavailable on GH runners — record skip
        # TODO(B7-2): wire kind + KVM-capable runner. For now we
        # just verify the deploy manifests are well-formed.
        run: |
          echo "kind/KVM not available on GH-hosted runners; e2e skipped"
          for f in deploy/helm/aether/templates/*.yaml deploy/ebpf/daemonset.yaml; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
          echo "deploy manifests present: $(ls deploy/helm/aether/templates/*.yaml | wc -l) helm + 1 ebpf"
