name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly probe for upstream @bytecodealliance/wasmtime per ADR-002.
    - cron: '17 9 * * 1'

# 不要把 fork 的 PR 也跑（节省 CI 配额）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Probe wasmtime upstream (ADR-002)
        # 不让这一步 fail PR；只在 schedule/cron 下作为可见提示。
        run: npm run check:wasmtime || true

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: packages/*/dist/
          retention-days: 7